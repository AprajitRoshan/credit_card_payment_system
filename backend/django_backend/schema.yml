openapi: 3.0.3
info:
  title: Credit Card Payment System API
  version: 1.0.0
  description: API documentation for the Credit Card Payment System
paths:
  /api/admin-panel/cards/:
    get:
      operationId: admin_panel_cards_retrieve
      description: Return all cards for administrator card management.
      tags:
      - admin-panel
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
    patch:
      operationId: admin_panel_cards_partial_update
      description: Block/unblock a card and/or update credit limit.
      tags:
      - admin-panel
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
  /api/admin-panel/cards/{card_id}/:
    get:
      operationId: admin_panel_cards_retrieve_2
      description: Return all cards for administrator card management.
      parameters:
      - in: path
        name: card_id
        schema:
          type: integer
        required: true
      tags:
      - admin-panel
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
    patch:
      operationId: admin_panel_cards_partial_update_2
      description: Block/unblock a card and/or update credit limit.
      parameters:
      - in: path
        name: card_id
        schema:
          type: integer
        required: true
      tags:
      - admin-panel
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
  /api/admin-panel/dashboard/:
    get:
      operationId: admin_panel_dashboard_retrieve
      tags:
      - admin-panel
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
  /api/admin-panel/system-health/:
    get:
      operationId: admin_panel_system_health_retrieve
      description: |-
        GET /api/admin/system-health/?hours=24

        Detailed health and API metrics for the admin dashboard.
        Available to Admin, Support and Read-Only roles.
      tags:
      - admin-panel
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
  /api/admin-panel/transactions/export/:
    get:
      operationId: admin_panel_transactions_export_retrieve
      tags:
      - admin-panel
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
  /api/admin/cards/:
    get:
      operationId: admin_cards_retrieve
      description: Return all cards for administrator card management.
      tags:
      - admin
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
    patch:
      operationId: admin_cards_partial_update
      description: Block/unblock a card and/or update credit limit.
      tags:
      - admin
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
  /api/admin/cards/{card_id}/:
    get:
      operationId: admin_cards_retrieve_2
      description: Return all cards for administrator card management.
      parameters:
      - in: path
        name: card_id
        schema:
          type: integer
        required: true
      tags:
      - admin
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
    patch:
      operationId: admin_cards_partial_update_2
      description: Block/unblock a card and/or update credit limit.
      parameters:
      - in: path
        name: card_id
        schema:
          type: integer
        required: true
      tags:
      - admin
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
  /api/admin/dashboard/:
    get:
      operationId: admin_dashboard_retrieve
      tags:
      - admin
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
  /api/admin/system-health/:
    get:
      operationId: admin_system_health_retrieve
      description: |-
        GET /api/admin/system-health/?hours=24

        Detailed health and API metrics for the admin dashboard.
        Available to Admin, Support and Read-Only roles.
      tags:
      - admin
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
  /api/admin/transactions/export/:
    get:
      operationId: admin_transactions_export_retrieve
      tags:
      - admin
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
  /api/auth/login/:
    post:
      operationId: auth_login_create
      description: |-
        Takes a set of user credentials and returns an access and refresh JSON web
        token pair to prove the authentication of those credentials.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenObtainPair'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenObtainPair'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenObtainPair'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenObtainPair'
          description: ''
  /api/auth/logout/:
    post:
      operationId: auth_logout_create
      tags:
      - auth
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
  /api/auth/me/:
    get:
      operationId: auth_me_retrieve
      tags:
      - auth
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
  /api/auth/register/:
    post:
      operationId: auth_register_create
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Register'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Register'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Register'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Register'
          description: ''
  /api/auth/token/refresh/:
    post:
      operationId: auth_token_refresh_create
      description: |-
        Takes a refresh type JSON web token and returns an access type JSON web
        token if the refresh token is valid.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRefresh'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenRefresh'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenRefresh'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenRefresh'
          description: ''
  /api/cards/:
    get:
      operationId: cards_list
      tags:
      - cards
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Card'
          description: ''
    post:
      operationId: cards_create
      tags:
      - cards
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Card'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Card'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Card'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Card'
          description: ''
  /api/cards/{id}/:
    delete:
      operationId: cards_destroy
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - cards
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/fraud/logs/:
    get:
      operationId: fraud_logs_list
      description: |-
        GET /api/fraud/logs/

        Admin, Support and Read-Only roles can review fraud logs.

        Filters: review_status, rule, user_id, start_date, end_date
      parameters:
      - name: limit
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      tags:
      - fraud
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedFraudLogList'
          description: ''
  /api/fraud/logs/{log_id}/review/:
    patch:
      operationId: fraud_logs_review_partial_update
      description: |-
        PATCH /api/fraud/logs/<id>/review/

        Admin and Support roles can mark a fraud log as reviewed.
      parameters:
      - in: path
        name: log_id
        schema:
          type: integer
        required: true
      tags:
      - fraud
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
  /api/health/:
    get:
      operationId: health_retrieve
      description: |-
        GET /api/health/

        Public liveness check used by Docker / uptime monitors.
        Returns 503 when the database is unreachable.
      tags:
      - health
      security:
      - {}
      responses:
        '200':
          description: No response body
  /api/notifications/credit-limit-alert/:
    post:
      operationId: notifications_credit_limit_alert_create
      tags:
      - notifications
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          description: No response body
  /api/notifications/fraud-alert/:
    post:
      operationId: notifications_fraud_alert_create
      tags:
      - notifications
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          description: No response body
  /api/notifications/transaction-alert/:
    post:
      operationId: notifications_transaction_alert_create
      tags:
      - notifications
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          description: No response body
  /api/schema/:
    get:
      operationId: schema_retrieve
      description: |-
        OpenApi3 schema for this API. Format can be selected via content negotiation.

        - YAML: application/vnd.oai.openapi
        - JSON: application/vnd.oai.openapi+json
      parameters:
      - in: query
        name: format
        schema:
          type: string
          enum:
          - json
          - yaml
      - in: query
        name: lang
        schema:
          type: string
          enum:
          - af
          - ar
          - ar-dz
          - ast
          - az
          - be
          - bg
          - bn
          - br
          - bs
          - ca
          - ckb
          - cs
          - cy
          - da
          - de
          - dsb
          - el
          - en
          - en-au
          - en-gb
          - eo
          - es
          - es-ar
          - es-co
          - es-mx
          - es-ni
          - es-ve
          - et
          - eu
          - fa
          - fi
          - fr
          - fy
          - ga
          - gd
          - gl
          - he
          - hi
          - hr
          - hsb
          - hu
          - hy
          - ia
          - id
          - ig
          - io
          - is
          - it
          - ja
          - ka
          - kab
          - kk
          - km
          - kn
          - ko
          - ky
          - lb
          - lt
          - lv
          - mk
          - ml
          - mn
          - mr
          - ms
          - my
          - nb
          - ne
          - nl
          - nn
          - os
          - pa
          - pl
          - pt
          - pt-br
          - ro
          - ru
          - sk
          - sl
          - sq
          - sr
          - sr-latn
          - sv
          - sw
          - ta
          - te
          - tg
          - th
          - tk
          - tr
          - tt
          - udm
          - ug
          - uk
          - ur
          - uz
          - vi
          - zh-hans
          - zh-hant
      tags:
      - schema
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/vnd.oai.openapi:
              schema:
                type: object
                additionalProperties: {}
            application/yaml:
              schema:
                type: object
                additionalProperties: {}
            application/vnd.oai.openapi+json:
              schema:
                type: object
                additionalProperties: {}
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/statements/monthly/:
    get:
      operationId: statements_monthly_retrieve
      tags:
      - statements
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
  /api/transactions/:
    get:
      operationId: transactions_list
      parameters:
      - name: limit
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      tags:
      - transactions
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedTransactionList'
          description: ''
  /api/transactions/analytics/:
    get:
      operationId: transactions_analytics_retrieve
      description: GET /api/transactions/analytics/?month=10&year=2026
      tags:
      - transactions
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
  /api/transactions/analytics/export/{file_format}/:
    get:
      operationId: transactions_analytics_export_retrieve
      description: |-
        GET /api/transactions/analytics/export/csv/?month=10&year=2026
        GET /api/transactions/analytics/export/pdf/?month=10&year=2026
      parameters:
      - in: path
        name: file_format
        schema:
          type: string
        required: true
      tags:
      - transactions
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
components:
  schemas:
    Card:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        card_type:
          $ref: '#/components/schemas/CardTypeEnum'
        card_holder_name:
          type: string
          maxLength: 100
        card_number:
          type: string
          writeOnly: true
          maxLength: 19
          minLength: 13
        masked_card_number:
          type: string
          readOnly: true
        last_four_digits:
          type: string
          readOnly: true
        credit_limit:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
        expiry_month:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
        expiry_year:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
        created_at:
          type: string
          format: date-time
          readOnly: true
        is_blocked:
          type: boolean
          readOnly: true
      required:
      - card_holder_name
      - card_number
      - card_type
      - created_at
      - expiry_month
      - expiry_year
      - id
      - is_blocked
      - last_four_digits
      - masked_card_number
    CardTypeEnum:
      enum:
      - CREDIT
      - DEBIT
      type: string
      description: |-
        * `CREDIT` - Credit Card
        * `DEBIT` - Debit Card
    CategoryEnum:
      enum:
      - SHOPPING
      - FOOD
      - TRAVEL
      - BILLS
      - ENTERTAINMENT
      - OTHER
      type: string
      description: |-
        * `SHOPPING` - Shopping
        * `FOOD` - Food
        * `TRAVEL` - Travel
        * `BILLS` - Bills
        * `ENTERTAINMENT` - Entertainment
        * `OTHER` - Other
    FraudLog:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        user_id:
          type: integer
          readOnly: true
        username:
          type: string
          readOnly: true
        email:
          type: string
          readOnly: true
        transaction_id:
          type: integer
          nullable: true
          readOnly: true
        payment_id:
          type: integer
          maximum: 9223372036854775807
          minimum: -9223372036854775808
          format: int64
        card_id:
          type: integer
          maximum: 9223372036854775807
          minimum: -9223372036854775808
          format: int64
        masked_card_number:
          type: string
          readOnly: true
        amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
        rules:
          type: array
          items:
            type: string
          readOnly: true
        device_id:
          type: string
          nullable: true
          maxLength: 100
        location_id:
          type: string
          nullable: true
          maxLength: 100
        alert_sent:
          type: boolean
        review_status:
          $ref: '#/components/schemas/ReviewStatusEnum'
        reviewed_by_username:
          type: string
          readOnly: true
        reviewed_at:
          type: string
          format: date-time
          nullable: true
        review_notes:
          type: string
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - amount
      - card_id
      - created_at
      - email
      - id
      - masked_card_number
      - payment_id
      - reviewed_by_username
      - rules
      - transaction_id
      - user_id
      - username
    FraudStatusEnum:
      enum:
      - CLEAR
      - FLAGGED
      type: string
      description: |-
        * `CLEAR` - Clear
        * `FLAGGED` - Flagged
    PaginatedFraudLogList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/FraudLog'
    PaginatedTransactionList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/Transaction'
    Register:
      type: object
      properties:
        username:
          type: string
          description: Required. 150 characters or fewer. Letters, digits and @/./+/-/_
            only.
          pattern: ^[\w.@+-]+$
          maxLength: 150
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          writeOnly: true
          minLength: 8
      required:
      - email
      - password
      - username
    ReviewStatusEnum:
      enum:
      - OPEN
      - CONFIRMED_FRAUD
      - FALSE_POSITIVE
      type: string
      description: |-
        * `OPEN` - Open
        * `CONFIRMED_FRAUD` - Confirmed Fraud
        * `FALSE_POSITIVE` - False Positive
    StatusEnum:
      enum:
      - PENDING
      - SUCCESS
      - FAILED
      type: string
      description: |-
        * `PENDING` - Pending
        * `SUCCESS` - Success
        * `FAILED` - Failed
    TokenObtainPair:
      type: object
      properties:
        username:
          type: string
          writeOnly: true
        password:
          type: string
          writeOnly: true
        access:
          type: string
          readOnly: true
        refresh:
          type: string
          readOnly: true
      required:
      - access
      - password
      - refresh
      - username
    TokenRefresh:
      type: object
      properties:
        access:
          type: string
          readOnly: true
        refresh:
          type: string
          writeOnly: true
      required:
      - access
      - refresh
    Transaction:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        payment_id:
          type: integer
          maximum: 9223372036854775807
          minimum: -9223372036854775808
          format: int64
        card_id:
          type: integer
          maximum: 9223372036854775807
          minimum: -9223372036854775808
          format: int64
        amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
        currency:
          type: string
          maxLength: 3
        status:
          $ref: '#/components/schemas/StatusEnum'
        category:
          $ref: '#/components/schemas/CategoryEnum'
        fraud_status:
          allOf:
          - $ref: '#/components/schemas/FraudStatusEnum'
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - amount
      - card_id
      - created_at
      - fraud_status
      - id
      - payment_id
      - status
  securitySchemes:
    jwtAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
